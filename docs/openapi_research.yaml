  /api/v1/research/reports/:
    get:
      operationId: research_reports_list
      description: Lists all non-deleted research reports owned by the authenticated
        user.
      summary: List user research reports
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Research
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResearchReportList'
          description: ''
        '401':
          description: Authentication required
    post:
      operationId: research_reports_create
      description: Submits a query to the multi-agent research pipeline with atomic
        concurrency limit validation (max 3 concurrent active tasks per user). Returns
        429 Too Many Requests if quota/concurrency is exhausted.
      summary: Create research inquiry
      tags:
      - Research
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResearchInquiryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateResearchInquiryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateResearchInquiryRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchReport'
          description: ''
        '400':
          description: Validation error in query or idempotency key
        '401':
          description: Authentication credentials were not provided
        '429':
          description: 'Too Many Requests: Maximum 3 parallel research tasks allowed
            per user'
  /api/v1/research/reports/{id}/:
    get:
      operationId: research_reports_retrieve
      description: Returns a research report and its verified/unverified artifacts.
        By default, only active current artifacts are returned. Pass include_superseded=true
        to inspect historical superseded artifacts from prior completed runs.
      summary: Retrieve research report
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this research report.
        required: true
      - in: query
        name: include_superseded
        schema:
          type: boolean
          default: false
        description: Include superseded historical artifacts from prior runs
      tags:
      - Research
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
