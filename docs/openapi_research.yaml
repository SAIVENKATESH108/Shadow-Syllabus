openapi: 3.0.3
info:
  title: Open Student Learning Platform - Multi-Agent Research API
  version: 1.0.0
  description: Open Student Learning Platform Multi-Agent Research API service. Provides
    asynchronous DAG research pipelines, run-scoped artifact provenance, verification
    confidence tracking, and fact-checker abstention guarantees.
