  /api/v1/research/reports/{id}/rerun/:
    post:
      operationId: research_reports_rerun_create
      description: Triggers a rerun of the research pipeline for an existing report.
        Prior completed artifacts remain active until the new run succeeds, at which
        point they are atomically marked superseded. Enforces per-user concurrency
        limit.
      summary: Rerun research pipeline
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this research report.
        required: true
