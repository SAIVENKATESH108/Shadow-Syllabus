          application/json:
            schema:
              $ref: '#/components/schemas/AIStudyCoachRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIStudyCoachRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIStudyCoachRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStudyCoachRequest'
          description: ''
