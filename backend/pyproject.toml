[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-platform-backend"
version = "0.1.0"
description = "Secure modular monolith backend for open student learning platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "Django>=5.2.18,<5.3.0",
    "djangorestframework>=3.15.0,<4.0.0",
    "drf-spectacular>=0.28.0",
    "uritemplate>=4.1.3",
    "requests>=2.32.0",
    "django-cors-headers>=4.3.1",
    "django-environ>=0.11.2",
    "channels>=4.1.0,<5.0.0",
    "daphne>=4.1.0,<5.0.0",
    "channels-redis>=4.2.0",
    "celery>=5.4.0,<6.0.0",
    "redis>=5.0.4",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "argon2-cffi>=23.1.0",
    "boto3>=1.34.80",
    "django-storages>=1.14.2",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "django-stubs>=5.0.4",
    "djangorestframework-stubs>=3.15.1",
    "pytest>=8.2.2",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
    "factory-boy>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "UP",  # pyupgrade
]
ignore = [
    "S101", # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
"config/settings/*" = ["S105"]
"**/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
minversion = "8.0"
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py", "tests.py", "*_tests.py"]
testpaths = ["tests", "apps"]
addopts = "--strict-markers -p no:warnings"
markers = [
    "django_db: Mark test as requiring a database.",
]
